# CI workflow for pi-lean-dimension monorepo
#
# Runs structural tests (test:ci) and MiniWoB++ browser tests
# (test:miniwob) on every PR and push to main.
#
# ── Structure ──────────────────────────────────────────────────────
#
# - Fast structural tests run first (no browser required).
# - MiniWoB++ browser tests run after, gated by:
#   1. Playwright Chromium (Phase 1; Firefox + Python backends are Phase 1.5)
#   2. Cloned MiniWoB++ content at the pinned commit
#   3. Dedicated browsergym venv (cached on requirements.txt hash)
#
# ── Attribution ────────────────────────────────────────────────────
#
# MiniWoB++ © Farama-Foundation (Apache-2.0)
# BrowserGym © ServiceNow (Apache-2.0)
# Pinned commit: miniwob-plusplus@7fd85d71a4b60325c6585396ec4f48377d049838
#
# ── Manual trigger ─────────────────────────────────────────────────
#
# workflow_dispatch lets you re-run from the Actions tab without
# pushing a new commit.
#
# ── Environment ────────────────────────────────────────────────────
#
# Node 22 (matching engines requirement in package.json)
# Ubuntu latest (for Playwright system deps)
# Python/venv backends auto-skip (no combined venv setup in CI — Phase 1.5)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs for the same PR/branch to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Structural tests (fast, no browser) ──────────────────────────
  structural:
    name: Structural tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run structural tests (test:ci)
        run: npm run test:ci

  # ── MiniWoB browser tests (venv + content + browser) ─────────────
  miniwob:
    name: MiniWoB browser tests
    runs-on: ubuntu-latest
    needs: structural

    # Only runs on push to main or PR (auto-skips when browser/venv/content absent)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium)
        run: npx playwright install --with-deps chromium

      - name: Create dedicated browsergym venv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: packages/pi-lean-host/venv
          key: browsergym-venv-${{ hashFiles('packages/pi-lean-host/requirements.txt') }}

      - name: Setup browsergym venv (if cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: npm run setup:venv -w pi-lean-host

      - name: Setup MiniWoB++ content
        run: npm run setup:miniwob

      - name: Run MiniWoB browser tests (test:miniwob)
        run: npm run test:miniwob

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miniwob-test-results
          path: |
            packages/pi-lean-host/results/
            packages/pi-lean-portal/__tests__/*.xml
          if-no-files-found: ignore
